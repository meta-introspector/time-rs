[package]
name = "time"
version = "0.3.44"
authors = ["Jacob Pratt <open-source@jhpratt.dev>", "Time contributors"]
edition = "2021"
# rust-version = "1.81.0"
repository = "https://github.com/time-rs/time"
homepage = "https://time-rs.github.io"
keywords = ["date", "time", "calendar", "duration"]
categories = [
    "date-and-time",
    "no-std",
    "parser-implementations",
    "value-formatting",
]
readme = "../README.md"
license = "MIT OR Apache-2.0"
description = "Date and time library. Fully interoperable with the standard library. Mostly compatible with #![no_std]."
include = ["src/**/*", "LICENSE-*", "README.md"]

[lib]
bench = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--generate-link-to-definition"]

[features]
default = ["std"]
alloc = ["serde_core?/alloc"]
formatting = ["dep:itoa", "std", "time-macros?/formatting"]
large-dates = ["time-macros?/large-dates"]
local-offset = ["std", "dep:libc", "dep:num_threads"]
macros = ["dep:time-macros"]
parsing = ["time-macros?/parsing"]
quickcheck = ["dep:quickcheck", "alloc", "deranged/quickcheck"]
#rand = ["rand08"]
#rand08 = ["dep:rand08", "deranged/rand08"]
serde = ["dep:serde_core", "time-macros?/serde", "deranged/serde"]
serde-human-readable = ["serde", "formatting", "parsing"]
# Deprecated in favor of using the relevant flags directly.
serde-well-known = ["serde", "formatting", "parsing"]
std = ["alloc"]
wasm-bindgen = ["dep:js-sys"]

# If adding an optional dependency, be sure to use the `dep:` prefix above to avoid an implicit
# feature gate.
[dependencies]
deranged = { path = "/data/data/com.termux.nix/files/home/pick-up-nix2/vendor/rust/cargo2nix/submodules/deranged/deranged" }
deranged-macros = { path = "/data/data/com.termux.nix/files/home/pick-up-nix2/vendor/rust/cargo2nix/submodules/deranged/deranged-macros" }
itoa = { path = "/data/data/com.termux.nix/files/home/pick-up-nix2/vendor/rust/cargo2nix/submodules/itoa" , optional = true }
#num-conv = { workspace = true }
num-conv = { path = "/data/data/com.termux.nix/files/home/pick-up-nix2/vendor/rust/cargo2nix/submodules/num-conv" }
powerfmt = { path = "/data/data/com.termux.nix/files/home/pick-up-nix2/vendor/rust/cargo2nix/submodules/powerfmt/powerfmt" }
powerfmt-macros = { path = "/data/data/com.termux.nix/files/home/pick-up-nix2/vendor/rust/cargo2nix/submodules/powerfmt/powerfmt-macros" }
#quickcheck = { workspace = true, optional = true }
quickcheck = { path = "/data/data/com.termux.nix/files/home/pick-up-nix2/vendor/rust/cargo2nix/submodules/quickcheck" , optional = true }
#rand08 = { workspace = true, optional = true }
#rand09 = { workspace = true, optional = true }
#rand08 = { path = "/data/data/com.termux.nix/files/home/pick-up-nix2/vendor/rust/cargo2nix/submodules/rand", optional = true }
#rand09 = { path = "/data/data/com.termux.nix/files/home/pick-up-nix2/vendor/rust/cargo2nix/submodules/rand" }
#serde_core = { workspace = true, optional = true }
serde_core = { path = "/data/data/com.termux.nix/files/home/pick-up-nix2/vendor/rust/cargo2nix/submodules/serde/serde_core" , default-features = false, optional = true }
#time-core = { workspace = true }
time-core = { path = "/data/data/com.termux.nix/files/home/pick-up-nix2/vendor/rust/cargo2nix/submodules/time-rs/time-core" }
#time-macros = { workspace = true, optional = true }
time-macros = { path = "/data/data/com.termux.nix/files/home/pick-up-nix2/vendor/rust/cargo2nix/submodules/time-rs/time-macros", optional = true }


[target.'cfg(target_family = "unix")'.dependencies]
libc = { workspace = true, optional = true }
num_threads = { workspace = true, optional = true }

[target.'cfg(all(target_family = "wasm", not(any(target_os = "emscripten", target_os = "wasi"))))'.dependencies]
js-sys = { workspace = true, optional = true }

[dev-dependencies]
num-conv = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_test = { workspace = true }
quickcheck_macros = { workspace = true }
time-macros = { workspace = true }
rstest = { workspace = true }
rstest_reuse = { workspace = true }

[target.'cfg(__ui_tests)'.dev-dependencies]
trybuild = { workspace = true }

[target.'cfg(bench)'.dev-dependencies]
criterion = { workspace = true }

# Significant contributions to the benchmarks provided by Emil Lundberg.
[[bench]]
name = "benchmarks"
harness = false
path = "../benchmarks/main.rs"

[[test]]
name = "tests"
path = "../tests/main.rs"
